<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="converter-card">
        <h2>Temperature Converter</h2>
        
        <div class="input-group">
            <label for="degrees">Degree / Value:</label>
            <input type="number" id="degrees" placeholder="Enter temperature" required>
        </div>

        <div class="input-group">
            <label for="type">Convert From:</label>
            <select id="type">
                <option value="celsius">Celsius (°C)</option>
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>
        </div>

        <button id="convert-btn">Convert Now</button>

        <div class="result-box">
            <h3>Converted Values:</h3>
            <div id="result-text">Enter a number and click convert.</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
